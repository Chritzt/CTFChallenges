<!DOCTYPE html>
<html lang="de">
<head>

    <title>Printer-Preview</title>

        body { background-color: #f5f5f5; font-family: "Courier New", monospace; margin: 40px; }
        .box { background-color: #fff; border: 2px dashed #333; padding: 20px; max-width: 600px; text-align: center; }
        .success { color: green; font-weight: bold; }

    <a href="/">⬅ Back</a>
</div>

</body>
</html>
