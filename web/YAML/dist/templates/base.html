<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Initech Dashboard{% endblock %}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; }
        header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        nav { background: #34495e; padding: 10px; text-align: center; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 800px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .footer { text-align: center; margin-top: 40px; color: #7f8c8d; font-size: 0.9em; }
        .alert { padding: 15px; background: #e8f4f8; border-left: 5px solid #3498db; margin: 20px 0; }
        button, input[type="submit"] { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 1em; }
        button:hover { background: #219653; }
    </style>
</head>
<body>
    <header>
        <h1>Initech Cloud-Synergy Portal v4.2</h1>
        <p><i>"Empowering Agile Synergies through Machine-Learning Blockchain Pipelines"</i></p>
    </header>
    <nav>
        <a href="{{ url_for('index') }}">Home / Status</a>
        <a href="{{ url_for('settings') }}">Global Settings</a>
        <a href="{{ url_for('importer') }}">Config Importer</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <div class="footer">
        &copy; 2026 Initech Corp. All rights reserved. (Please don't look at our source code).
    </div>
</body>
</html>
