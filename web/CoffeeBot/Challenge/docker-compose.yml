services:
  challenge:
    image: localhost/coffeebot
    container_name: coffeebot-chall
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - HOST=127.0.0.1
      - PORT=8080
      - TIMEOUT=${TIMEOUT:-30}
      - FLAG=FLAG{flag_flag_flag}
    pull_policy: never
    read_only: false
    privileged: false
    platform: linux/amd64