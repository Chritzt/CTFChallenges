<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-Standard // High Frequency Trading</title>
    <style>
        :root {
            --neon-green: #00ff66;
            --neon-red: #ff3366;
            --bg-dark: #0a0b0d;
            --panel-bg: #14161d;
            --text-main: #e2e8f0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .terminal {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 2px solid #2d3748;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.1);
            overflow: hidden;
        }

        .header {
            background: #1a202c;
            padding: 10px 20px;
            border-bottom: 2px solid #2d3748;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--neon-red);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--neon-red);
        }

        .status-dot.connected {
            background-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
        }

        .content {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .content { grid-template-columns: 1fr; }
        }

        h2 {
            color: var(--neon-green);
            margin-top: 0;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .feed-container {
            background: #0d0e12;
            border: 1px solid #2d3748;
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .log-entry {
            margin-bottom: 8px;
            border-left: 3px solid var(--neon-green);
            padding-left: 8px;
            animation: fadeIn 0.3s ease;
        }

        .log-entry.flag {
            border-left-color: var(--neon-red);
            color: var(--neon-red);
            font-weight: bold;
            background: rgba(255, 51, 102, 0.1);
            padding: 5px 8px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #718096;
        }

        input {
            width: 100%;
            background: #0d0e12;
            border: 1px solid #4a5568;
            padding: 10px;
            color: var(--text-main);
            font-family: inherit;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--neon-green);
        }

        button {
            width: 100%;
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 12px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            border-radius: 4px;
        }

        button:hover {
            background: var(--neon-green);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">
        <div><strong>SUB-STANDARD // HFT TERMINAL v1.0.4</strong></div>
        <div>Status: <span id="status" class="status-dot"></span></div>
    </div>
    
    <div class="content">
        <div>
            <h2>Live Market Feed</h2>
            <div id="feed" class="feed-container">
                <div style="color: #718096;">Connecting to WebSocket stream...</div>
            </div>
        </div>

        <div>
            <h2>Debug Mutation Console</h2>
            <p style="font-size: 0.8rem; color: #a0aec0; margin-bottom: 20px;">
                Authorized clients can dynamically patch reactive stream bindings.
            </p>
            
            <div class="input-group">
                <label>Stream Name</label>
                <input type="text" id="streamName" value="marketUpdates">
            </div>
            
            <div class="input-group">
                <label>Target Channel</label>
                <input type="text" id="targetChannel" placeholder="e.g. public:ticker">
            </div>
            
            <button id="sendBtn">Execute Mutation</button>
            <div id="mutationResult" style="margin-top: 15px; font-size: 0.85rem;"></div>
        </div>
    </div>
</div>

<script>
    const feed = document.getElementById('feed');
    const status = document.getElementById('status');
    const sendBtn = document.getElementById('sendBtn');
    const mutationResult = document.getElementById('mutationResult');

    const token = "Bearer user-guest_terminal";
    const ws = new WebSocket(`ws://${window.location.host}/graphql`, 'graphql-transport-ws');

    ws.onopen = () => {

        ws.send(JSON.stringify({
            type: 'connection_init',
            payload: { Authorization: token }
        }));
    };

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        
        if (msg.type === 'connection_ack') {
            status.classList.add('connected');
            feed.innerHTML = '';
            
            ws.send(JSON.stringify({
                id: "1",
                type: 'subscribe',
                payload: { query: 'subscription { marketUpdates }' }
            }));
        }

        if (msg.type === 'next' && msg.payload.data) {
            const dataStr = msg.payload.data.marketUpdates;
            const entry = document.createElement('div');
            
            if (dataStr.includes('CLA{')) {
                entry.className = 'log-entry flag';
            } else {
                entry.className = 'log-entry';
            }
            
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${dataStr}`;
            feed.appendChild(entry);
            feed.scrollTop = feed.scrollHeight; 
        }
    };

    sendBtn.onclick = () => {
        const stream = document.getElementById('streamName').value;
        const target = document.getElementById('targetChannel').value;

        mutationResult.style.color = '#e2e8f0';
        mutationResult.innerText = "Sending mutation payload over WebSocket...";

        const mutationQuery = `
            mutation {
                updateCacheConfig(streamName: "${stream}", targetChannel: "${target}")
            }
        `;

        ws.send(JSON.stringify({
            id: "2",
            type: 'subscribe',
            payload: { query: mutationQuery }
        }));

        mutationResult.innerText = "Payload deployed. Check server state or stream logs.";
        mutationResult.style.color = 'var(--neon-green)';
    };
</script>
</body>
</html>
